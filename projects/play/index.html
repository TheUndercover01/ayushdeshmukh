<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Play With the Robot — Ayush Deshmukh</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Space+Grotesk:wght@400;500;700;800&family=JetBrains+Mono:wght@400;700&display=swap">
<link rel="stylesheet" href="../../assets/css/style.css?v=7">
<script>try{if(localStorage.getItem("theme")==="dark")document.documentElement.dataset.theme="dark"}catch(e){}</script>
<style>
  .tabs{display:flex;flex-wrap:wrap;gap:.6rem;margin:1.2rem 0 1rem}
  .tabs button{font:700 .9rem "Space Grotesk",sans-serif;background:var(--card);color:var(--fg);border:3px solid var(--fg);border-radius:6px;
    box-shadow:4px 4px 0 var(--shadow);padding:.5rem .95rem;cursor:pointer}
  .tabs button[aria-selected="true"]{background:var(--accent-hi);color:#211d19}
  .game{border:3px solid var(--fg);border-radius:6px;box-shadow:6px 6px 0 var(--shadow);background:var(--card);overflow:hidden}
  .game iframe{display:block;width:100%;height:1150px;border:0;background:var(--bg)}
  @media(max-width:820px){.game iframe{height:1700px}}
  .offline{padding:1.4rem 1.2rem;font-size:1rem;line-height:1.6}
  .offline b{font-family:"Space Grotesk",sans-serif}
  .hint{color:var(--muted);font-size:.9rem;margin:.6rem 0 0}
</style>
</head>
<body>

<header class="paper-bar">
  <a class="paper-home" href="../../index.html"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 3 2 11.5h3V21h5.5v-6h3v6H19v-9.5h3z"/></svg>Ayush Deshmukh Home</a>
  <button class="theme-toggle" type="button" aria-label="Switch to dark mode">☾ Dark mode</button>
</header>

<main class="paper">
  <header class="paper-head">
    <h1 class="paper-title">Play With the Robot</h1>
    <p class="paper-sub">The robot from <a href="../never-shown/">I Never Showed It the Task</a>, live.</p>
  </header>

  <div class="tabs" role="tablist">
    <button role="tab" id="t-sabotage" aria-selected="true" data-game="sabotage">Sabotage the robot</button>
    <button role="tab" id="t-tictactoe" aria-selected="false" data-game="tictactoe">Tic-tac-toe</button>
    <button role="tab" id="t-playground" aria-selected="false" data-game="playground">Build a sentence</button>
  </div>
  <p class="paper-text" id="blurb"></p>

  <div class="game" id="game"><div class="offline">Connecting to the robot…</div></div>
  <p class="hint">Runs on my own GPU, so it's only online sometimes. One player at a time.</p>

  <footer class="site-footer paper-foot">© 2026 Ayush Deshmukh · <a href="../index.html">All side quests</a></footer>
</main>

<script>
const BLURB = {
  sabotage: "One sabotage per round. You win if the task isn't really done when the robot stops. Best of five. To beat it you need to know how it works: its only memory is its own \"(done)\" marks.",
  tictactoe: "You play O. The robot has to physically place its X; a fumble loses the turn.",
  playground: "Build a sentence of up to ten commands and watch the robot work through it."
};
let servers = null, current = "sabotage";

async function loadServers() {
  try {
    const r = await fetch("servers.json?t=" + Date.now(), {cache: "no-store"});
    servers = r.ok ? await r.json() : {};
  } catch (e) { servers = {}; }
}

async function alive(url) {
  try {
    const c = new AbortController(); const t = setTimeout(() => c.abort(), 6000);
    const r = await fetch(url + "/health?t=" + Date.now(), {signal: c.signal, cache: "no-store"});
    clearTimeout(t); return r.ok;
  } catch (e) { return false; }
}

async function show(game) {
  current = game;
  document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.game === game));
  document.getElementById("blurb").textContent = BLURB[game];
  const box = document.getElementById("game");
  box.innerHTML = '<div class="offline">Connecting to the robot…</div>';
  if (servers === null) await loadServers();
  const url = servers && servers[game];
  if (!url || !(await alive(url))) {
    if (current !== game) return;
    box.innerHTML = '<div class="offline"><b>The robot is offline right now.</b><br>' +
      'Videos are on the <a href="../never-shown/">project page</a>.</div>';
    return;
  }
  if (current !== game) return;
  box.innerHTML = "";
  const f = document.createElement("iframe");
  f.src = url + (game === "playground" ? "/?modes=build" : "/"); f.title = {sabotage: "Sabotage the robot", tictactoe: "Tic-tac-toe against the robot", playground: "Build a sentence for the robot"}[game];
  f.allow = "fullscreen"; box.appendChild(f);
}

document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => show(b.dataset.game));
const want = new URLSearchParams(location.search).get("game");
show(["playground", "tictactoe"].includes(want) ? want : "sabotage");
</script>
<script src="../../assets/js/main.js"></script>
</body>
</html>
