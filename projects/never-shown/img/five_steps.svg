<text x="700.0" y="27.5" text-anchor="middle" font-family="Space Grotesk, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="800" fill="#211d19">4</text>
<g transform="translate(681.0,50) scale(1.6)" fill="none" stroke="#211d19" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 12s3.5-6.5 9.5-6.5S21.5 12 21.5 12s-3.5 6.5-9.5 6.5S2.5 12 2.5 12z"/><circle cx="12" cy="12" r="2.8"/></g>
<text x="700.0" y="124" text-anchor="middle" font-family="Space Grotesk, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#211d19">Distill into a VLA</text>
<text x="700.0" y="152" text-anchor="middle" font-family="Source Serif 4, Georgia, serif" font-size="14" fill="#726657">It copies the teacher</text>
<text x="700.0" y="171" text-anchor="middle" font-family="Source Serif 4, Georgia, serif" font-size="14" fill="#726657">from cameras and</text>
<text x="700.0" y="190" text-anchor="middle" font-family="Source Serif 4, Georgia, serif" font-size="14" fill="#726657">the sentence.</text>
<rect x="821" y="29" width="176" height="200" rx="7" fill="#211d19"/>
