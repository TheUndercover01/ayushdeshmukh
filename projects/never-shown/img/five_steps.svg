<text x="902.0" y="27.5" text-anchor="middle" font-family="Space Grotesk, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="800" fill="#211d19">5</text>
<g transform="translate(883.0,50) scale(1.6)" fill="none" stroke="#211d19" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5 9.5 18 20 6.5"/></g>
<text x="902.0" y="124" text-anchor="middle" font-family="Space Grotesk, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="700" fill="#211d19">Compose new tasks</text>
<text x="902.0" y="152" text-anchor="middle" font-family="Source Serif 4, Georgia, serif" font-size="14" fill="#211d19">One sentence, six</text>
<text x="902.0" y="171" text-anchor="middle" font-family="Source Serif 4, Georgia, serif" font-size="14" fill="#211d19">commands, never</text>
<text x="902.0" y="190" text-anchor="middle" font-family="Source Serif 4, Georgia, serif" font-size="14" fill="#211d19">demonstrated.</text>
