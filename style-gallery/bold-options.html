<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bold text options</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Instrument+Serif:ital@0;1&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Space+Grotesk:wght@400;500;700;800&family=JetBrains+Mono:wght@400;700;800&display=swap">
<link rel="stylesheet" href="../assets/css/style.css">
<style>
  .opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,440px),1fr));gap:26px;margin-top:10px}
  .opt{background:var(--card);border:3px solid var(--fg);border-radius:4px;box-shadow:6px 6px 0 var(--shadow);padding:18px 20px}
  .opt h3{margin:0 0 12px;font-family:"Space Grotesk",sans-serif;font-size:.95rem;font-weight:800;text-transform:uppercase;letter-spacing:.04em}
  .opt h3 span{font-family:"JetBrains Mono",monospace;font-weight:400;text-transform:none;letter-spacing:0;color:var(--muted);font-size:.8rem;margin-left:6px}
  .opt .tagline{font-size:1.35rem;max-width:none}
  .opt .bio{text-align:left;font-size:.95rem}
  .opt .b{color:var(--c);font-family:var(--f);font-weight:var(--w,700);font-size:var(--s,.92em);font-style:normal;text-decoration:none}
  [data-theme="dark"] .opt .b{color:var(--cd)}
  .opt a.b:hover{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
  /* marker style */
  .opt.marker .b{background:linear-gradient(transparent 55%, color-mix(in oklch, var(--accent-hi) 70%, transparent) 55%);padding:0 2px}
  [data-theme="dark"] .opt.marker .b{background:linear-gradient(transparent 55%, color-mix(in oklch, var(--accent-hi) 40%, transparent) 55%)}
</style>
<script>try{if(localStorage.getItem("theme")==="dark")document.documentElement.dataset.theme="dark"}catch(e){}</script>
</head>
<body>
<header class="nav">
  <nav class="links"><a href="../index.html">← Back to site</a></nav>
  <button class="theme-toggle" type="button" aria-label="Switch to dark mode">☾ Dark mode</button>
</header>
<main style="max-width:1100px">
  <h1 class="page-title">Bold text options</h1>
  <p class="page-sub">Same text, eight styles for the bold words (the links and "tiny scientist"). Use the toggle to check each in dark mode, then tell me the number.</p>
  <div class="opts" id="opts"></div>
</main>
<script>
const OPTS = [
  {n:1, name:'Ink blue', font:'Space Grotesk', c:'#1e4fa3', cd:'#8fb6ff', f:"'Space Grotesk',sans-serif"},
  {n:2, name:'Ink blue', font:'JetBrains Mono', c:'#1e4fa3', cd:'#8fb6ff', f:"'JetBrains Mono',monospace", s:'.85em'},
  {n:3, name:'Forest green', font:'Space Grotesk', c:'#2e6b3a', cd:'#8fd19e', f:"'Space Grotesk',sans-serif"},
  {n:4, name:'Deep teal', font:'JetBrains Mono', c:'#0e6b6b', cd:'#6fd6d0', f:"'JetBrains Mono',monospace", s:'.85em'},
  {n:5, name:'Plum', font:'Space Grotesk', c:'#7a2e6b', cd:'#e29ad6', f:"'Space Grotesk',sans-serif"},
  {n:6, name:'Plum', font:'Instrument Serif italic', c:'#7a2e6b', cd:'#e29ad6', f:"'Instrument Serif',serif", s:'1.12em', w:'400', italic:true},
  {n:7, name:'Black + mustard highlighter', font:'Space Grotesk', c:'#211d19', cd:'#efe6d6', f:"'Space Grotesk',sans-serif", marker:true},
  {n:8, name:'Ink blue', font:'Caveat handwriting', c:'#1e4fa3', cd:'#8fb6ff', f:'Caveat,cursive', s:'1.3em'},
];
const b = (t, href) => href ? `<a class="b" href="${href}" target="_blank" rel="noopener">${t}</a>` : `<span class="b">${t}</span>`;
document.getElementById('opts').innerHTML = OPTS.map(o => `
  <div class="opt${o.marker ? ' marker' : ''}" style="--c:${o.c};--cd:${o.cd};--f:${o.f};${o.s ? '--s:'+o.s+';' : ''}${o.w ? '--w:'+o.w+';' : ''}">
    <h3>${o.n}. ${o.name}<span>${o.font}</span></h3>
    <p class="tagline">Every baby is a ${b('tiny scientist')}, learning its body by grabbing, dropping, and exploring. I give robots that same hands-on childhood.</p>
    <div class="bio"><p>I'm a Research Assistant at the ${b('SLMC lab','https://informatics.ed.ac.uk/slmc')} at the University of Edinburgh, working with ${b('Prof. Sethu Vijayakumar','https://homepages.inf.ed.ac.uk/svijayak/')}. Before that, I did my BTech at NITK Surathkal with ${b('Prof. Anand Kumar','https://infotech.nitk.ac.in/faculty/anand-kumar-m')}, and spent time at the ${b('CANDLE lab','https://sites.google.com/view/comparch-machinelearning-lab/home')} with ${b('Prof. Sparsh Mittal','https://faculty.iitr.ac.in/~sparshfec/')}.</p></div>
  </div>`).join('');
OPTS.forEach((o, i) => { if (o.italic) document.querySelectorAll('.opt')[i].querySelectorAll('.b').forEach(e => e.style.fontStyle = 'italic'); });
</script>
<script src="../assets/js/main.js"></script>
</body>
</html>
